/* прибираємо стандартний заголовок GLightbox */

}

/* перший рядок */

}

/* посилання */
.gslide-description a {

    text-decoration: underline !important;
}

/* щоб опис був внизу */
.gslide-desc {

}

/* не даємо GLightbox робити свій білий блок */
.glightbox-container .gslide-description {

}

/* ===========================================================

=========================================================== */

@media (max-width: 700px) {

    .gslide-description {

<script src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"></script>


<script>

const lightbox = GLightbox({

    selector: '.masonry-item',

    touchNavigation: true,

    loop: true,

    zoomable: true,

    descPosition: 'bottom'

});


/*
   Робимо чорний блок опису тієї самої ширини,
   що й саме зображення.
*/

function resizeDescription() {

    const slide = document.querySelector('.gslide.current');

    if (!slide) return;


    const image = slide.querySelector('.gslide-media');

    const description = slide.querySelector('.gslide-description');


    if (!image || !description) return;


    const width = image.getBoundingClientRect().width;


    if (width > 0) {

        description.style.width = width + 'px';

        description.style.maxWidth = width + 'px';

    }

}


/* після відкриття */

lightbox.on('open', function() {

    setTimeout(resizeDescription, 100);

    setTimeout(resizeDescription, 300);

    setTimeout(resizeDescription, 600);

});


/* при переході між роботами */

lightbox.on('slide_changed', function() {

    setTimeout(resizeDescription, 100);

    setTimeout(resizeDescription, 300);

});


/* при зміні розміру вікна */

window.addEventListener('resize', function() {

    resizeDescription();

});

</script>
