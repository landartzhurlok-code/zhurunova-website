<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Despair II — Marharyta Zhurunova</title>

    <meta name="description"
        content="Despair II by Marharyta Zhurunova">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Manrope:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="../assets/css/style.css"
    >

    <!-- GLIGHTBOX -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css"
    >

<style>

/* =====================================================
   DESPAIR II — COVER
===================================================== */

.project2-cover {
    display: block !important;

    width: auto !important;
    max-width: 550px !important;
    max-height: 600px !important;

    height: auto !important;

    margin: 55px auto 42px auto !important;

    object-fit: contain !important;
}


/* =====================================================
   DESPAIR II — GALLERY
   2 COLUMNS / HORIZONTAL
===================================================== */

.project2-gallery {
    display: grid !important;

    grid-template-columns: repeat(2, minmax(0, 1fr)) !important;

    gap: 18px !important;

    width: 82% !important;

    max-width: 760px !important;

    margin: 55px auto 90px auto !important;

    padding: 0 !important;

    columns: unset !important;
    column-count: unset !important;
    column-gap: unset !important;
}


/* =====================================================
   GALLERY CELL
===================================================== */

.project2-gallery-item {
    display: flex !important;

    width: 100% !important;

    aspect-ratio: 3 / 2 !important;

    margin: 0 !important;
    padding: 0 !important;

    overflow: hidden !important;

    align-items: center !important;
    justify-content: center !important;

    background: transparent !important;
}


/* =====================================================
   GALLERY IMAGE
   NO DISTORTION
===================================================== */

.project2-gallery-item img {
    display: block !important;

    width: 100% !important;
    height: 100% !important;

    max-width: 100% !important;
    max-height: 100% !important;

    margin: 0 !important;
    padding: 0 !important;

    aspect-ratio: auto !important;

    object-fit: contain !important;
}


/* =====================================================
   TABLET
===================================================== */

@media (max-width: 900px) {

    .project2-cover {
        max-width: 500px !important;
    }

    .project2-gallery {
        width: 90% !important;

        grid-template-columns: repeat(2, minmax(0, 1fr)) !important;

        gap: 14px !important;
    }

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    .project2-cover {
        width: 100% !important;
        max-width: 100% !important;
        max-height: none !important;

        margin-top: 40px !important;
        margin-bottom: 35px !important;
    }


    .project2-gallery {
        width: 100% !important;

        grid-template-columns: 1fr !important;

        gap: 14px !important;

        margin-top: 40px !important;
        margin-bottom: 60px !important;
    }


    .project2-gallery-item {
        aspect-ratio: 3 / 2 !important;
    }

}

</style>

</head>


<body>


<!-- =========================================================
     HEADER
========================================================= -->

<header class="site-header">

    <div class="container header-container">

        <a
            href="../index.html"
            class="logo"
        >

            <span class="logo-name">
                MARHARYTA<br>
                ZHURUNOVA
            </span>

        </a>


        <nav class="navigation">

            <a
                href="../index.html"
                class="nav-link"
            >
                About
            </a>

            <a
                href="../cv.html"
                class="nav-link"
            >
                CV
            </a>

            <a
                href="../portfolio.html"
                class="nav-link"
            >
                Projects
            </a>

            <a
                href="../works.html"
                class="nav-link"
            >
                Works
            </a>

            <a
                href="../index.html#contact"
                class="nav-link"
            >
                Contact
            </a>

        </nav>

    </div>

</header>



<!-- =========================================================
     PROJECT
========================================================= -->

<main class="project-page">

    <div class="container narrow">


        <!-- =====================================================
             COVER
        ====================================================== -->

        <img
            class="project2-cover"
            src="../assets/images/projects/project7_cover.jpg"
            alt="Despair II"
        >


        <!-- =====================================================
             TITLE
        ====================================================== -->

        <div class="project-header">

            <h1>
                DESPAIR II
            </h1>

            <div class="project-year">

                <p>
                    2023
                </p>

            </div>

        </div>



        <!-- =====================================================
             TEXT
        ====================================================== -->

        <div class="project-text">

            <p>
                21 × 30 cm<br>
                Handprinted monotype<br>
                2023
            </p>

            <p>
                International Center for the Arts in Monte Castello di Vibio,
                Italy, through the organization Artist at Risk, 2023
            </p>

        </div>



        <!-- =====================================================
             GALLERY
        ====================================================== -->

        <div
            class="project2-gallery"
            id="project-gallery"
        >
        </div>


    </div>

</main>



<!-- =========================================================
     FOOTER
========================================================= -->

<footer>

    <div class="container footer-container">

        <p>
            © 2026 Marharyta Zhurunova
        </p>

    </div>

</footer>



<!-- =========================================================
     GLIGHTBOX
========================================================= -->

<script
    src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js">
</script>


<script>

    const gallery = document.getElementById("project-gallery");

    for (let i = 1; i <= 33; i++) {

        const imagePath =
            `../assets/images/projects/project7_${i}.jpg`;

        const item = document.createElement("a");

        item.href = imagePath;

        item.className = "project2-gallery-item glightbox";

        item.setAttribute("data-gallery", "project7");

        item.innerHTML = `
            <img
                src="${imagePath}"
                alt="Despair II — ${i}"
            >
        `;

        gallery.appendChild(item);
    }


    GLightbox({

        selector: '.project2-gallery-item',

        touchNavigation: true,

        loop: true,

        zoomable: true,

        draggable: true

    });

</script>


</body>

</html>
